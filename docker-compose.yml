networks:
  lms_network:
    driver: bridge

services:
  # ─── Databases & Infrastructure ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: lms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: lms_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lms_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ─────────────────────────────────────────────────
  backend:
    image: lms-backend:latest

    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: lms_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: lms_db
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MINIO_ENDPOINT: http://minio:9000
      MINIO_KEY: minioadmin
      MINIO_SECRET: minioadmin123
      MINIO_BUCKET: lms-videos
      MINIO_REGION: us-east-1
      PHPRC: /var/www/dev-php.ini
    expose:
      - "8000"
    command: >
      sh -c "
      [ -f .env ] || cp .env.example .env &&
      composer install --no-interaction --prefer-dist --optimize-autoloader &&
      [ -f storage/.key_generated ] || (php artisan key:generate --force && touch storage/.key_generated) &&
      php artisan config:clear &&
      php artisan migrate --force &&
      [ -L public/storage ] || php artisan storage:link &&
      php artisan avatars:publish || true &&
      ([ -f storage/.seeded ] || (php artisan db:seed --force && touch storage/.seeded) || true) &&
      ([ -f storage/.minio_setup ] || (php artisan minio:setup && touch storage/.minio_setup) || true) &&
      while true; do
        php -d upload_max_filesize=200M -d post_max_size=210M -d memory_limit=512M -d max_execution_time=300 artisan serve --host=0.0.0.0 --port=8000;
        echo 'artisan serve exited, restarting in 2s...';
        sleep 2;
      done
      "
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network

  frontend:
    # Production for public tunnel. Vite-dev over Cloudflare breaks hydration
    # (admin/SSR look fine but clicks & API never bind). Local HMR: target=development + volumes.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NUXT_PUBLIC_API_BASE: /api
        # Unique per compose build → helps confirm the live image after deploy
        NUXT_PUBLIC_BUILD_ID: ${NUXT_PUBLIC_BUILD_ID:-manual}
    container_name: lms_frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_INTERNAL: http://nginx/api
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=4096
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - lms_network

  n8n:
    image: n8nio/n8n:latest
    container_name: lms_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
      DB_TYPE: sqlite
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - lms_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lms_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      # Đường dẫn public thật (đứng sau nginx, dưới sub-path /phpmyadmin/) —
      # cần thiết để phpMyAdmin sinh đúng URL/redirect khi reverse-proxy.
      PMA_ABSOLUTE_URI: https://eript-lms.io.vn/phpmyadmin/
    ports:
      - "8083:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lms_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lms_ai_service
    restart: unless-stopped
    volumes:
      - ./ai-service:/app
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-qwen2.5:latest}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      # Phải khớp AI_SERVICE_SHARED_SECRET trong backend/.env — rỗng = không bắt buộc xác thực.
      AI_SERVICE_SHARED_SECRET: ${AI_SERVICE_SHARED_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    networks:
      - lms_network

  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      # Cho phép nginx gọi deploy-agent trên host (127.0.0.1:9099)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./backend/public:/var/www/public:ro
      # `php artisan storage:link` makes public/storage an ABSOLUTE symlink to
      # /var/www/storage/app/public — that only resolves inside the backend
      # container. Nginx is a separate container that never mounted
      # ./backend/storage, so the link dangled and every uploaded file
      # (site logo, favicon, login background, etc.) 404'd.
      #
      # Mounted at a path OUTSIDE the read-only /var/www/public mount above
      # (not nested inside it) — nesting a mount inside an already read-only
      # bind mount makes the container runtime create the mountpoint
      # directory on a read-only filesystem, which fails on native Linux
      # Docker (e.g. a fresh Ubuntu deploy): "read-only file system" /
      # "failed to create shim task". This exact layout worked on Windows
      # Docker Desktop only because that mountpoint directory happened to
      # already exist from earlier manual testing.
      - ./backend/storage/app/public:/var/www/storage-app-public:ro
    depends_on:
      - backend
      - frontend
    networks:
      - lms_network

  # ── Cloudflare Tunnel → https://eript-lms.io.vn ─────────────────────────────
  # Chỉ chạy khi bật profile "public":
  #   docker compose --profile public up -d
  # hoặc:  .\scripts\start-public.ps1
  #
  # Trước đó: tạo tunnel trên Cloudflare Zero Trust, Public Hostname trỏ tới
  # http://nginx:80, rồi dán token vào file .env (CLOUDFLARE_TUNNEL_TOKEN).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lms_cloudflared
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - lms_network

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  minio_data:
  n8n_data:
  backend_vendor:
  frontend_node_modules:
