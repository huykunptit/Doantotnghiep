# Prefer X-Forwarded-Proto from Cloudflare Tunnel when present
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Docker's embedded DNS. An `upstream {}` block resolves a service name once
# at startup/reload and caches the IP for the worker's lifetime — when a
# container restarts (crash, redeploy) and gets a new IP, nginx keeps
# proxying to the dead address until nginx itself is restarted, producing a
# 502 that outlives the actual outage. Using a variable in proxy_pass forces
# nginx to re-resolve through this resolver on every request instead.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name localhost eript-lms.io.vn www.eript-lms.io.vn _;

    client_max_body_size 500M;

    # ── API → Laravel ──────────────────────────────────────────────────────────
    location /api {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── Laravel static assets (public/) ────────────────────────────────────────
    location /storage {
        alias /var/www/storage-app-public;
        try_files $uri $uri/ =404;
    }

    # ── MinIO proxy (SCORM / video / media files) ───────────────────────────────
    # Rewrites /minio/<bucket>/<path> → http://minio:9000/<bucket>/<path>
    location /minio/ {
        set $minio_upstream http://minio:9000;
        proxy_pass         $minio_upstream/;
        proxy_set_header   Host              minio:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Strip the /minio prefix when forwarding to MinIO
        proxy_pass_request_headers on;
        # Allow large SCORM packages
        client_max_body_size 500M;
        # Required so MinIO path-style URLs work
        proxy_buffering    off;
    }

    # ── Nuxt frontend ──────────────────────────────────────────────────────────
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        # WebSocket support for Nuxt HMR in dev
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
