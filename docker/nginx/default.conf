# Prefer X-Forwarded-Proto from Cloudflare Tunnel when present
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

upstream minio {
    server minio:9000;
}

server {
    listen 80;
    server_name localhost eript-lms.io.vn www.eript-lms.io.vn _;

    client_max_body_size 500M;

    # ── API → Laravel ──────────────────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── Laravel static assets (public/) ────────────────────────────────────────
    location /storage {
        alias /var/www/public/storage;
        try_files $uri $uri/ =404;
    }

    # ── MinIO proxy (SCORM / video / media files) ───────────────────────────────
    # Rewrites /minio/<bucket>/<path> → http://minio:9000/<bucket>/<path>
    location /minio/ {
        proxy_pass         http://minio/;
        proxy_set_header   Host              minio:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Strip the /minio prefix when forwarding to MinIO
        proxy_pass_request_headers on;
        # Allow large SCORM packages
        client_max_body_size 500M;
        # Required so MinIO path-style URLs work
        proxy_buffering    off;
    }

    # ── Nuxt frontend ──────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        # WebSocket support for Nuxt HMR in dev
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
