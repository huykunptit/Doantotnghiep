# Prefer X-Forwarded-Proto from Cloudflare Tunnel when present
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Docker's embedded DNS. An `upstream {}` block resolves a service name once
# at startup/reload and caches the IP for the worker's lifetime — when a
# container restarts (crash, redeploy) and gets a new IP, nginx keeps
# proxying to the dead address until nginx itself is restarted, producing a
# 502 that outlives the actual outage. Using a variable in proxy_pass forces
# nginx to re-resolve through this resolver on every request instead.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name localhost eript-lms.io.vn www.eript-lms.io.vn _;

    client_max_body_size 500M;

    # ── API → Laravel ──────────────────────────────────────────────────────────
    location /api {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # ── Laravel static assets (public/) ────────────────────────────────────────
    location /storage {
        alias /var/www/storage-app-public;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── MinIO proxy (SCORM / video / media files) ───────────────────────────────
    location /minio/ {
        set $minio_upstream http://minio:9000;
        proxy_pass         $minio_upstream/;
        proxy_set_header   Host              minio:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        client_max_body_size 500M;
        proxy_buffering    off;
    }

    # ── Deploy console (host agent) ────────────────────────────────────────────
    # Host chạy: scripts/deploy-ubuntu.sh agent (127.0.0.1:9099)
    # Mở: /update-lms/?token=DEPLOY_SECRET  → live log + nút deploy
    location = /update-lms {
        return 302 /update-lms/;
    }
    location /update-lms/ {
        # host.docker.internal → host (extra_hosts trong docker-compose).
        # Không dùng biến + resolver ở đây: hostname lấy từ /etc/hosts của container.
        proxy_pass         http://host.docker.internal:9099/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    # ── Nuxt hashed assets — cache forever (filename changes every build) ──────
    location ^~ /_nuxt/ {
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Nuxt HTML / SSR pages — never cache so deploys show immediately ────────
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
