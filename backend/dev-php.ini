; Custom PHP ini for `php artisan serve` (built-in CLI web server).
; Loaded via: PHPRC=$(pwd)/dev-php.ini php artisan serve
; Or shorter:  composer serve
;
; Why this file exists:
;   `php artisan serve` spawns a child `php -S ...` that does NOT inherit -d flags
;   from the parent. Environment vars DO propagate, so PHPRC is the way to override
;   ini values for the actual web server process.

upload_max_filesize = 1024M
post_max_size       = 1024M
memory_limit        = 512M
max_execution_time  = 300
max_input_time      = 300

; Keep response body clean — PHP notices/warnings go to stderr instead of being
; echoed into HTTP responses (which would corrupt JSON parsing on the frontend).
display_errors         = stderr
display_startup_errors = 0
log_errors             = On
