name: sylva_lms
description: "Sylva LMS - Mobile app for students"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  video_player: ^2.8.2
  chewie: ^1.7.5
  file_picker: ^8.0.0
  open_file: ^3.3.2
  fl_chart: ^0.66.0
  google_sign_in: ^6.2.1
  webview_flutter: ^4.7.0
  url_launcher: ^6.2.5
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/
